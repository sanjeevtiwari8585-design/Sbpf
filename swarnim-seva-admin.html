<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>स्वर्णिम सेवा प्रशासन | SBPF</title>
<style>
:root{--wine:#781426;--gold:#d7b64b;--bg:#f6f4f1;--line:#e7dfd5;--muted:#667085}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#252525;font-family:Arial,system-ui,sans-serif;line-height:1.5}header{background:linear-gradient(110deg,#741326,#a6293b);color:#fff;padding:18px max(14px,calc((100% - 1100px)/2));border-bottom:4px solid var(--gold)}header h1{margin:0;font-size:23px}.wrap{max-width:1100px;margin:auto;padding:16px}.bar,.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}.stat b{font-size:24px;color:var(--wine);display:block}.filters,.actions{display:flex;gap:8px;flex-wrap:wrap}input,select,textarea,button{font:inherit}input,select,textarea{padding:10px;border:1px solid #d4d4d4;border-radius:8px;max-width:100%}.filters input{flex:1;min-width:190px}.btn{border:0;border-radius:8px;padding:10px 13px;background:var(--wine);color:#fff;font-weight:700;cursor:pointer}.btn.alt{background:#eee8df;color:#4b2630}.case{background:white;border:1px solid var(--line);border-radius:13px;padding:14px;margin:12px 0}.case h3{color:var(--wine);margin:5px 0}.meta{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid label{font-size:13px;font-weight:700;display:block;margin:8px 0 4px}.grid select,.grid input,.grid textarea{width:100%}.notice{padding:12px;border-radius:10px;background:#fff7df;border:1px solid #eadba9}.error{background:#fff0f0;border-color:#e9bcbc;color:#991b1b}.success{background:#effaf1;border-color:#b9dfc0;color:#176b35}.pill{display:inline-block;padding:3px 8px;border-radius:30px;background:#f5e9cc;font-size:12px}.hidden{display:none!important}@media(max-width:650px){.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.wrap{padding:10px}}
</style><link rel="stylesheet" href="assets/sbpf-grid-layout.css">
</head><body>
<header><h1>स्वर्णिम सेवा — प्रशासन एवं समन्वय</h1><div>केस समीक्षा • स्वयंसेवक नियुक्ति • कार्रवाई अपडेट</div></header>
<main class="wrap">
<div class="bar"><a href="swarnim-seva.html">← स्वर्णिम सेवा</a>　|　<a href="member-panel.html">सदस्य पैनल</a>　|　<a href="admin-work-areas.html">स्वयंसेवक अनुरोध समीक्षा</a><div id="msg" class="notice" style="margin-top:10px">प्रशासनिक अधिकार की जाँच हो रही है…</div></div>
<section class="stats"><div class="stat">कुल आवेदन<b id="total">—</b></div><div class="stat">समीक्षा लंबित<b id="pending">—</b></div><div class="stat">नियुक्त<b id="assigned">—</b></div><div class="stat">समाधान<b id="resolved">—</b></div></section>
<div class="bar filters"><input id="search" placeholder="केस नंबर, नाम, जिला या विषय खोजें"><select id="statusFilter"><option value="">सभी स्थितियाँ</option><option value="submitted">नए आवेदन</option><option value="under_review">समीक्षा में</option><option value="need_more_info">जानकारी चाहिए</option><option value="assigned">नियुक्त</option><option value="in_progress">कार्य जारी</option><option value="resolved">समाधान</option><option value="rejected">अस्वीकृत</option></select><button class="btn alt" id="refresh">रिफ्रेश</button></div>
<div id="cases">डेटा लोड हो रहा है…</div>
</main>
<script>
const API='https://dxowhzghrdghfzoggorx.supabase.co',KEY='sb_publishable_Papyb2MMv6Sr3V3QMjVSNQ_3GWXCiCo',token=localStorage.getItem('sbpf_access_token')||'';
const $=id=>document.getElementById(id),esc=v=>String(v??'—').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const statusNames={submitted:'नया आवेदन',under_review:'समीक्षा में',need_more_info:'अतिरिक्त जानकारी चाहिए',verified:'सत्यापित',assigned:'स्वयंसेवक नियुक्त',in_progress:'कार्य जारी',referred:'संदर्भित',partially_supported:'आंशिक सहायता',resolved:'समाधान हुआ',closed:'बंद',rejected:'अस्वीकृत'};
const statusOptions=Object.entries(statusNames).map(([v,n])=>'<option value="'+v+'">'+n+'</option>').join('');
let data={cases:[],volunteers:[],categories:[]};
async function api(path,opts={}){const r=await fetch(API+path,{...opts,headers:{apikey:KEY,Authorization:'Bearer '+token,'Content-Type':'application/json',...(opts.headers||{})}});let j;try{j=await r.json()}catch{}if(!r.ok)throw Error(j?.message||j?.details||'अनुरोध विफल');return j}
function say(t,kind='notice'){$('msg').className='notice '+kind;$('msg').textContent=t}
function draw(){
 const q=$('search').value.toLowerCase(),st=$('statusFilter').value;
 const list=data.cases.filter(c=>(!st||c.status===st)&&(!q||[c.case_number,c.title,c.family_name,c.family_code,c.district,c.category_name].join(' ').toLowerCase().includes(q)));
 $('total').textContent=data.cases.length;$('pending').textContent=data.cases.filter(c=>['submitted','under_review','need_more_info'].includes(c.status)).length;$('assigned').textContent=data.cases.filter(c=>['assigned','in_progress'].includes(c.status)).length;$('resolved').textContent=data.cases.filter(c=>['resolved','closed'].includes(c.status)).length;
 $('cases').innerHTML=(data.volunteers.length? '' : '<div class="notice">अभी कोई स्वीकृत/सक्रिय स्वयंसेवक उपलब्ध नहीं है। सदस्य पैनल के स्वर्णिम सिपाही अभियान से आए अनुरोधों की समीक्षा <a href="admin-work-areas.html">स्वयंसेवक अनुरोध समीक्षा</a> में करें; स्वीकृत होने के बाद वे यहाँ नियुक्ति सूची में दिखेंगे।</div>')+(list.length?list.map(c=>'<article class="case" data-id="'+c.id+'"><div class="meta">'+esc(c.case_number)+'　•　'+esc(c.submitted_at?new Date(c.submitted_at).toLocaleString('hi-IN'):'')+'　•　<span class="pill">'+esc(statusNames[c.status]||c.status)+'</span></div><h3>'+esc(c.title)+'</h3><div><b>'+esc(c.family_name)+'</b> ('+esc(c.family_code)+') — '+esc(c.category_name)+'</div><p>'+esc(c.description)+'</p><div class="meta">क्षेत्र: '+esc([c.village_or_ward,c.tehsil,c.district,c.state,c.pincode].filter(Boolean).join(', '))+'<br>संपर्क: '+esc(c.contact_phone||c.family_mobile)+' • प्राथमिकता: '+esc(c.urgency)+' • अनुरोधित सहयोग: '+esc(c.requested_support)+'</div><div class="grid"><div><label>स्थिति अपडेट</label><select class="case-status">'+statusOptions+'</select></div><div><label>स्वयंसेवक नियुक्त करें</label><select class="volunteer"><option value="">नियुक्ति न बदलें</option>'+data.volunteers.map(v=>'<option value="'+v.id+'">'+esc(v.name||'स्वयंसेवक')+' — '+esc(v.district||v.area||'')+'</option>').join('')+'</select></div><div><label>स्वीकृत सहायता राशि (₹)</label><input class="amount" type="number" min="0" step="1" value="'+(c.approved_amount??'')+'" placeholder="यदि लागू हो"></div><div><label>परिवार को दिखने वाला कार्रवाई नोट</label><input class="note" maxlength="1000" placeholder="जैसे दस्तावेज़ जाँच / संपर्क किया"></div></div><div class="actions"><button class="btn save">अपडेट सुरक्षित करें</button><span class="meta">'+(c.assigned_volunteer_id?'मौजूदा स्वयंसेवक ID: '+esc(c.assigned_volunteer_id):'अभी नियुक्ति नहीं')+'</span></div></article>').join(''):'<div class="card">इस फ़िल्टर में कोई आवेदन नहीं मिला।</div>');
 document.querySelectorAll('.case').forEach(el=>{const c=data.cases.find(x=>x.id===Number(el.dataset.id));el.querySelector('.case-status').value=c.status;el.querySelector('.save').addEventListener('click',()=>save(el,c))});
}
async function load(){if(!token){say('पहले SBPF सदस्य/प्रशासन खाते से लॉगिन करें।','error');$('cases').textContent='लॉगिन आवश्यक';return}
 try{await api('/auth/v1/user');const d=await api('/rest/v1/rpc/admin_swarnim_seva_dashboard',{method:'POST',body:'{}'});data=d||data;data.cases=data.cases||[];data.volunteers=data.volunteers||[];draw();say('प्रशासनिक पहुँच सत्यापित। आवेदन और स्वयंसेवक सूची लोड हो गई।','success')}
 catch(e){say('प्रवेश नहीं मिला या डेटा लोड नहीं हुआ: '+e.message,'error');$('cases').textContent='केवल अधिकृत SBPF एडमिन इस पैनल को खोल सकते हैं।'}}
async function save(el,c){const volunteer=el.querySelector('.volunteer').value;const amount=el.querySelector('.amount').value;const note=el.querySelector('.note').value;const status=el.querySelector('.case-status').value;const btn=el.querySelector('.save');btn.disabled=true;btn.textContent='सुरक्षित हो रहा है…';
 try{await api('/rest/v1/rpc/admin_swarnim_seva_update_case',{method:'POST',body:JSON.stringify({p_case_id:c.id,p_status:status,p_note:note||null,p_volunteer_id:volunteer?Number(volunteer):null,p_approved_amount:amount===''?null:Number(amount)})});say('केस '+c.case_number+' अपडेट हो गया।','success');await load()}
 catch(e){say('अपडेट विफल: '+e.message,'error');btn.disabled=false;btn.textContent='अपडेट सुरक्षित करें'}}
$('search').addEventListener('input',draw);$('statusFilter').addEventListener('change',draw);$('refresh').addEventListener('click',load);load();
</script></body></html>
