<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BVS Admin | SBPF</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{--wine:#781626;--gold:#c59b36;--bg:#f7f4ef}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px/1.5 system-ui,"Noto Sans Devanagari",sans-serif;color:#29232a}header{background:linear-gradient(120deg,var(--wine),#9b2938,var(--gold));color:white;padding:22px 16px}.wrap{max-width:1150px;margin:auto;padding:18px}h1{margin:0}h2{color:var(--wine)}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.tabs button,.action{border:0;background:var(--wine);color:white;padding:10px 13px;border-radius:8px;cursor:pointer;font-weight:700}.card{background:white;border:1px solid #eadfd3;border-radius:13px;padding:16px;margin:12px 0}.row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start}.muted{color:#716a67;font-size:13px}.photos{display:flex;gap:7px;flex-wrap:wrap}.photos img{width:95px;height:75px;object-fit:cover;border-radius:7px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.approve{background:#176a43}.reject{background:#a22}.status{padding:12px;background:#fff4d8;border-radius:9px;margin:12px 0}input{padding:9px;border:1px solid #ddd;border-radius:8px}@media(max-width:650px){.row{grid-template-columns:1fr}}
</style><link rel="stylesheet" href="assets/sbpf-grid-layout.css">
</head><body><header><div class="wrap"><h1>SBPF — BVS Admin Panel</h1><p>Business verification और property listing moderation</p><a href="bvs-marketplace.html" style="color:white">Public Marketplace</a> · <a href="bvs.html" style="color:white">Member Portal</a></div></header><main class="wrap"><div id="status" class="status">Admin access जाँचा जा रहा है…</div><div class="tabs"><button id="businessTab">Business Profiles</button><button id="propertyTab">Property Listings</button><button id="reload">Refresh</button></div><section id="panel"></section></main>
<script>
const sb=supabase.createClient('https://dxowhzghrdghfzoggorx.supabase.co','sb_publishable_Papyb2MMv6Sr3V3QMjVSNQ_3GWXCiCo'),$=id=>document.getElementById(id);let admin=false,mode='business';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function init(){const u=await sb.auth.getUser();if(!u.data.user){$('status').textContent='पहले SBPF Admin account से login करें।';return}const a=await sb.from('admin_users').select('user_id').eq('user_id',u.data.user.id).maybeSingle();if(a.error||!a.data){$('status').textContent='यह account BVS Admin के लिए अधिकृत नहीं है।';return}admin=true;$('status').textContent='Admin access verified।';await load()}
async function load(){if(!admin)return; if(mode==='business'){const r=await sb.from('bvs_business_profiles').select('*').order('created_at',{ascending:false});if(r.error)return $('panel').textContent=r.error.message;$('panel').innerHTML='<h2>Business Profiles ('+r.data.length+')</h2>'+r.data.map(x=>'<article class="card"><div class="row"><div><b>'+esc(x.business_name)+'</b><div class="muted">'+esc(x.business_type)+' • '+esc(x.city)+' • '+esc(x.state)+'</div><p>'+esc(x.description)+'</p><div>मोबाइल: '+esc(x.phone)+' | WhatsApp: '+esc(x.whatsapp)+'</div><div>पता: '+esc(x.address)+'</div><b>स्थिति: '+esc(x.status)+'</b></div><div class="muted">'+new Date(x.created_at).toLocaleDateString('hi-IN')+'</div></div><div class="actions"><button class="action approve" data-id="'+x.id+'" data-status="approved">Approve</button><button class="action reject" data-id="'+x.id+'" data-status="rejected">Reject</button><button class="action" data-id="'+x.id+'" data-status="suspended">Suspend</button></div></article>').join('')||'<p>कोई प्रोफाइल नहीं।</p>'}
else{const r=await sb.from('bvs_properties').select('*,bvs_business_profiles(business_name,phone,whatsapp)').order('created_at',{ascending:false});if(r.error)return $('panel').textContent=r.error.message;$('panel').innerHTML='<h2>Property Listings ('+r.data.length+')</h2>'+r.data.map(x=>'<article class="card"><div class="row"><div><b>'+esc(x.title)+'</b><div class="muted">'+esc(x.property_type)+' • '+esc(x.listing_type)+' • '+esc(x.location)+' • '+(x.price?'₹'+Number(x.price).toLocaleString('en-IN'):'कीमत पूछें')+'</div><p>'+esc(x.description)+'</p><div>व्यवसाय: '+esc(x.bvs_business_profiles?.business_name)+' | संपर्क: '+esc(x.contact_phone||x.bvs_business_profiles?.phone)+'</div><b>स्थिति: '+esc(x.status)+'</b> '+(x.is_featured?'⭐ Featured':'')+'</div></div><div class="photos">'+(x.images||[]).map(u=>'<a href="'+esc(u)+'" target="_blank"><img src="'+esc(u)+'"></a>').join('')+'</div><label>Reject reason (optional) <input id="reason-'+x.id+'" placeholder="कारण"></label><div class="actions"><button class="action approve" data-id="'+x.id+'" data-status="approved">Approve / Publish</button><button class="action reject" data-id="'+x.id+'" data-status="rejected">Reject</button><button class="action" data-id="'+x.id+'" data-status="sold">Mark Sold</button><button class="action" data-id="'+x.id+'" data-feature="true">Feature</button></div></article>').join('')||'<p>कोई listing नहीं।</p>'}
}
$('panel').addEventListener('click',async e=>{const b=e.target.closest('button[data-id]');if(!b)return;const id=b.dataset.id;if(mode==='business'){const r=await sb.from('bvs_business_profiles').update({status:b.dataset.status,verification_note:'Admin update'}).eq('id',id);if(r.error)alert(r.error.message);else await load()}else if(b.dataset.feature){const r=await sb.from('bvs_properties').update({is_featured:true}).eq('id',id);if(r.error)alert(r.error.message);else await load()}else{const reason=document.getElementById('reason-'+id)?.value||null;const r=await sb.from('bvs_properties').update({status:b.dataset.status,rejection_reason:reason}).eq('id',id);if(r.error)alert(r.error.message);else await load()}});
$('businessTab').onclick=()=>{mode='business';load()};$('propertyTab').onclick=()=>{mode='property';load()};$('reload').onclick=load;init();
</script></body></html>
