<g fill="#fff" font-family="Noto Sans Devanagari,Arial,sans-serif" opacity=".95">
 <text x="70" y="90" font-size="22" font-weight="700" letter-spacing="3">सेवा • सहयोग • स्वावलंबन • सशक्तिकरण</text>
 <text x="70" y="150" font-size="36" font-weight="800">हर परिवार तक अवसर और सहायता</text>
 <text x="70" y="200" font-size="23">शिक्षा  |  स्वास्थ्य  |  महिला सशक्तिकरण  |  पर्यावरण  |  जनसेवा</text>
 <text x="70" y="250" font-size="20" opacity=".9">जागरूक नागरिक • आत्मनिर्भर समाज • समृद्ध भारत</text>
</g>
<g fill="#f3c66c"><circle cx="70" cy="300" r="5"/><circle cx="92" cy="300" r="5"/><circle cx="114" cy="300" r="5"/></g>
</svg>