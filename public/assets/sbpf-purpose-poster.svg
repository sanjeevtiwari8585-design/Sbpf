<g transform="translate(980 58)" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity=".9">
 <g transform="translate(0 12)"><path d="M0 30 Q35 5 70 30 V100 Q35 75 0 100Z"/><path d="M70 30 Q105 5 140 30 V100 Q105 75 70 100Z"/><path d="M70 30V100"/></g>
