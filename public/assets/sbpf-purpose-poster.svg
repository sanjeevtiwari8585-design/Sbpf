<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" role="img" aria-labelledby="title desc">
<title id="title">स्वर्णिम भारत परिवार फाउंडेशन — सेवा और सशक्तिकरण</title>
<desc id="desc">शिक्षा, स्वास्थ्य, महिला सशक्तिकरण, पर्यावरण और जनसेवा को दर्शाता प्रेरक पृष्ठभूमि पोस्टर।</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c472e"/><stop offset=".58" stop-color="#167647"/><stop offset="1" stop-color="#d88c2c"/></linearGradient>
 <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff4cb" stop-opacity=".9"/><stop offset="1" stop-color="#fff4cb" stop-opacity="0"/></linearGradient>
</defs>
<rect width="1600" height="420" fill="url(#bg)"/>
<circle cx="1380" cy="80" r="260" fill="url(#sun)"/>
