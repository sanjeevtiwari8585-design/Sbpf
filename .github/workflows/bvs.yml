name: BVS validation
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify BVS member portal
        run: test -f bvs.html && grep -q "Bhumi Vyapar System" bvs.html && test -f bvs-admin.html && test -f bvs-marketplace.html && test -f bhumi-vyapar.html
