name: SBPF Seva Auto Health Monitor

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sbpf-auto-health-monitor.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: sbpf-health-monitor
  cancel-in-progress: false

jobs:
  health-check:
    name: Read-only production health checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check public website and Supabase health endpoints
        id: health
        shell: bash
        run: |
          python - <<'PY'
          import json, os, urllib.error, urllib.request
          checks = [
              ("SBPF Seva live site", "https://sbpfseva.floot.app/", "web"),
              ("SBPF GitHub Pages home", "https://sanjeevtiwari8585-design.github.io/Sbpf/", "optional_web"),
              ("Member registration page", "https://sanjeevtiwari8585-design.github.io/Sbpf/member.html", "optional_web"),
              ("Swarnim AI Studio page", "https://sanjeevtiwari8585-design.github.io/Sbpf/swarnim-ai-studio.html", "optional_web"),
              ("Swarnim Creator page", "https://sanjeevtiwari8585-design.github.io/Sbpf/swarnim-creator.html", "optional_web"),
              ("Swarnim Video Editor page", "https://sanjeevtiwari8585-design.github.io/Sbpf/swarnim-video-editor.html", "optional_web"),
              ("Supabase Auth health", "https://dxowhzghrdghfzoggorx.supabase.co/auth/v1/health", "supabase"),
          ]
          results = []
          for name, url, kind in checks:
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "SBPF-Seva-HealthMonitor/1.0"})
                  with urllib.request.urlopen(req, timeout=15) as response:
                      code = response.status
                  ok = 200 <= code < 400
                  results.append({"name": name, "url": url, "status": code, "ok": ok})
              except urllib.error.HTTPError as e:
                  # Supabase may require an API key even on health endpoints; an HTTP response proves reachability.
                  ok = kind == "supabase" and e.code in (401, 403)
                  results.append({"name": name, "url": url, "status": e.code, "ok": ok, "note": "reachable but access-restricted" if ok else "HTTP error"})
              except Exception as e:
                  reason = getattr(e, "reason", None)
                  detail = (str(reason) if reason else type(e).__name__)[:180]
                  # Hosted runners can temporarily fail to resolve GitHub Pages.
                  # Keep this as a warning; primary SBPF and Supabase failures remain blocking.
                  optional_network_warning = kind == "optional_web"
                  results.append({"name": name, "url": url, "status": "NETWORK_ERROR", "ok": optional_network_warning, "warning": detail if optional_network_warning else None, "error": None if optional_network_warning else detail})
          failed = [r for r in results if not r["ok"]]
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("failed=" + ("true" if failed else "false") + "\n")
              out.write("report<<SBPF_REPORT\n")
              out.write(json.dumps({"checked_at_utc": __import__("datetime").datetime.now(__import__("datetime").timezone.utc).isoformat(), "checks": results}, indent=2))
              out.write("\nSBPF_REPORT\n")
          print(json.dumps(results, indent=2))
          if failed:
              raise SystemExit(1)
          PY

      - name: Open or update a single health alert
        if: always() && steps.health.outputs.failed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          REPORT: ${{ steps.health.outputs.report }}
        shell: bash
        run: |
          title="[SBPF Health] Production check failed"
          body=$(printf '## SBPF Seva health-monitor alert\n\nOne or more read-only availability checks failed. This monitor does not modify production systems or attempt risky repairs.\n\nRun: %s/actions/runs/%s\n\nReport (UTC):\n%s\n\nNext step: inspect the failing endpoint and logs. No database, RLS, DNS, payment, secret, or member-data changes were made.\n' "${{ github.server_url }}/${{ github.repository }}" "${{ github.run_id }}" "$REPORT")
          existing=$(gh issue list --repo "$GH_REPO" --state open --search 'SBPF Health Production check failed in:title' --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "Health alert #$existing is already open; leaving it open without hourly comment spam."
          else
            gh issue create --repo "$GH_REPO" --title "$title" --body "$body"
          fi

      - name: Close resolved health alert
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          existing=$(gh issue list --repo "$GH_REPO" --state open --search 'SBPF Health Production check failed in:title' --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue close "$existing" --repo "$GH_REPO" --reason completed --comment "All configured health checks passed on this run. The alert was automatically closed; if the problem returns, a new alert will be opened."
          fi

      - name: Record successful health check
        if: success()
        run: echo "All configured public health endpoints returned successful HTTP status codes."
