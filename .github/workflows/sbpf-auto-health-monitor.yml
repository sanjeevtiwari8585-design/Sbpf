name: SBPF Seva Auto Health Monitor

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sbpf-auto-health-monitor.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: sbpf-health-monitor
  cancel-in-progress: false

jobs:
  health-check:
    name: Read-only production health checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check public website and Supabase health endpoints
        id: health
        shell: bash
        run: |
          python - <<'PY'
          import json, os, urllib.error, urllib.request
          checks = [
              ("SBPF Seva live site", "https://sbpfseva.floot.app/"),
              ("SBPF GitHub Pages home", "https://sanjeevtiwari8585-design.github.io/Sbpf/"),
              ("Member registration page", "https://sanjeevtiwari8585-design.github.io/Sbpf/member.html"),
              ("Swarnim AI Studio page", "https://sanjeevtiwari8585-design.github.io/Sbpf/swarnim-ai-studio.html"),
              ("Swarnim Creator page", "https://sanjeevtiwari8585-design.github.io/Sbpf/swarnim-creator.html"),
              ("Swarnim Video Editor page", "https://sanjeevtiwari8585-design.github.io/Sbpf/swarnim-video-editor.html"),
              ("Supabase Auth health", "https://dxowhzghrdghfzoggorx.supabase.co/auth/v1/health"),
          ]
          results = []
          for name, url in checks:
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "SBPF-Seva-HealthMonitor/1.0"})
                  with urllib.request.urlopen(req, timeout=15) as response:
                      code = response.status
                  ok = 200 <= code < 400
                  results.append({"name": name, "url": url, "status": code, "ok": ok})
              except urllib.error.HTTPError as e:
                  code = e.code
                  # Auth health is expected to be publicly readable; other endpoints must be successful.
                  results.append({"name": name, "url": url, "status": code, "ok": False, "error": "HTTP error"})
              except Exception as e:
                  results.append({"name": name, "url": url, "status": "NETWORK_ERROR", "ok": False, "error": type(e).__name__})
          failed = [r for r in results if not r["ok"]]
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("failed=" + ("true" if failed else "false") + "\n")
              out.write("report<<SBPF_REPORT\n")
              out.write(json.dumps({"checked_at_utc": __import__("datetime").datetime.now(__import__("datetime").timezone.utc).isoformat(), "checks": results}, indent=2))
              out.write("\nSBPF_REPORT\n")
          print(json.dumps(results, indent=2))
          if failed:
              raise SystemExit(1)
          PY

      - name: Open or update a single health alert
        if: always() && steps.health.outputs.failed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          REPORT: ${{ steps.health.outputs.report }}
        shell: bash
        run: |
          title="[SBPF Health] Production check failed"
          body="## SBPF Seva health-monitor alert

          One or more read-only availability checks failed. This monitor does not modify production systems or attempt risky repairs.

          **Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          **Report (UTC):**
          ```json
          $REPORT
          ```

          **Next step:** inspect the failing endpoint and logs. No database, RLS, DNS, payment, secret, or member-data changes were made."
          existing=$(gh issue list --repo "$GH_REPO" --state open --label "sbpf-health-alert" --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GH_REPO" --body "$body"
          else
            gh issue create --repo "$GH_REPO" --title "$title" --label "sbpf-health-alert" --body "$body" || {
              gh issue create --repo "$GH_REPO" --title "$title" --body "$body"
            }
          fi

      - name: Record successful health check
        if: success()
        run: echo "All configured public health endpoints returned successful HTTP status codes."
