name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable full-card social sharing on public pages
        run: python scripts/enable-card-sharing.py

      - name: Generate individual social preview pages from Supabase cards
        run: python scripts/generate-card-share-pages.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate inline JavaScript in HTML pages
        run: |
          python - <<'PY'
          import pathlib, re, subprocess, tempfile
          pages = sorted(pathlib.Path('.').rglob('*.html'))
          checked = 0
          for page in pages:
              if '.git' in page.parts or 'node_modules' in page.parts:
                  continue
              source = page.read_text(encoding='utf-8')
              scripts = re.findall(r'<script\b[^>]*>(.*?)</script\s*>', source, re.I | re.S)
              for index, script in enumerate(scripts, 1):
                  if not script.strip():
                      continue
                  with tempfile.NamedTemporaryFile('w', suffix='.js', encoding='utf-8', delete=False) as handle:
                      handle.write(script)
                      temp_path = handle.name
                  try:
                      subprocess.run(['node', '--check', temp_path], check=True)
                  finally:
                      pathlib.Path(temp_path).unlink(missing_ok=True)
                  checked += 1
                  print(f'Validated inline script {index}: {page}')
          print(f'Validated {checked} inline JavaScript blocks across {len(pages)} HTML pages.')
          PY

      - name: Validate browser video renderer JavaScript
        run: node --check swarnim-ai-renderer.js

      - name: Validate reusable SBPF card sharing JavaScript
        run: |
          node --check assets/sbpf-card-share.js
          node --check assets/sbpf-universal-card-share.js
          node --check assets/sbpf-share-landing.js
          python -m py_compile scripts/enable-card-sharing.py scripts/generate-card-share-pages.py

      - name: Validate Swarnim Book app assets
        run: |
          test -s swarnim-book-office.html
          test -s swarnim-book.html
          test -s swarnim-book.webmanifest
          test -s swarnim-book-sw.js
          python - <<'PY'
          import json, pathlib
          manifest=json.loads(pathlib.Path('swarnim-book.webmanifest').read_text(encoding='utf-8'))
          assert manifest.get('name') == 'Swarnim Book - SBPF'
          assert manifest.get('display') == 'standalone'
          assert pathlib.Path('swarnim-book-office.html').is_file()
          assert pathlib.Path('public/assets/sbpf-logo.svg').is_file()
          print('Swarnim Book PWA assets and SBPF logo verified.')
          PY

      - name: Verify SwarnimBook social features
        run: |
          grep -q "get_my_member_verification_status" swarnim-book.html
          grep -q "sbpf_social_stories" swarnim-book.html
          grep -q "sbpf_social_start_direct_thread" swarnim-book.html
          grep -q "sbpf_social_create_group_thread" swarnim-book.html
          grep -q "sbpf_social_notifications" swarnim-book.html
          test -s supabase/migrations/20261105120000_sbpf_social_direct_threads.sql
          grep -q "sbpf_user_fully_verified" supabase/migrations/20261105120000_sbpf_social_direct_threads.sql

      - name: Smoke-test site structure and local links
        run: |
          python - <<'PY'
          import html.parser, pathlib, sys, urllib.parse
          root = pathlib.Path('.').resolve()
          required = ['index.html', 'member.html', 'member-panel.html', 'member-verification.html', 'member-services.html']
          missing = [p for p in required if not (root / p).is_file()]
          if missing:
              print('Missing required entry pages:', ', '.join(missing))
              sys.exit(1)
          verification_page = (root / 'member-verification.html').read_text(encoding='utf-8')
          if 'type="password"' in verification_page.lower() or '/functions/v1/member-id-verify' not in verification_page:
              print('Public member verification must use the public verification endpoint and must not request a password.')
              sys.exit(1)
          member_entry = (root / 'member-panel.html').read_text(encoding='utf-8')
          if 'member-verification.html' not in member_entry:
              print('Member entry must route to the public verification page.')
              sys.exit(1)

          class Links(html.parser.HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links = []
              def handle_starttag(self, tag, attrs):
                  for key, value in attrs:
                      if key in ('href', 'src', 'poster') and value:
                          self.links.append((tag, key, value.strip()))

          pages = sorted(root.rglob('*.html'))
          issues = []
          checked = 0
          for page in pages:
              if '.git' in page.parts or 'node_modules' in page.parts:
                  continue
              parser = Links()
              parser.feed(page.read_text(encoding='utf-8'))
              for tag, key, raw in parser.links:
                  value = raw.strip()
                  if not value or value.startswith(('#', '//', 'http://', 'https://', 'mailto:', 'tel:', 'data:', 'javascript:', 'blob:')):
                      continue
                  if '{' in value or '}' in value:
                      continue
                  path = urllib.parse.unquote(urllib.parse.urlsplit(value).path)
                  if not path:
                      continue
                  target = (root / path.lstrip('/')) if path.startswith('/') else (page.parent / path)
                  target = target.resolve()
                  if target.is_dir():
                      target = target / 'index.html'
                  checked += 1
                  if root not in target.parents and target != root:
                      issues.append(f'{page.relative_to(root)}: path escapes site root: {value}')
                  elif not target.is_file():
                      issues.append(f'{page.relative_to(root)}: missing {key} target: {value}')
          print(f'Checked {len(pages)} HTML pages and {checked} local links/assets.')
          if issues:
              print('Broken local links/assets:')
              print('\\n'.join(issues))
              sys.exit(1)
          print('Site structure smoke tests passed.')
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
