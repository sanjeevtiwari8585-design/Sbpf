<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>महिला शक्ति Admin | SBPF</title>
<style>
:root{--wine:#781626;--gold:#d7b34b;--ink:#25212a;--muted:#6b6268;--line:#eadfd3}*{box-sizing:border-box}body{margin:0;background:#f7f3ee;color:var(--ink);font:15px/1.55 system-ui,"Noto Sans Devanagari",sans-serif}header{background:linear-gradient(120deg,#711222,#9b2634 65%,#bd963b);color:white;padding:20px max(16px,calc((100% - 1100px)/2));border-bottom:5px solid var(--gold)}main{max-width:1100px;margin:20px auto;padding:0 14px 45px}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:17px;margin-bottom:13px}h1{margin:0}h2{color:var(--wine);font-size:19px;margin:0 0 9px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.stat{padding:13px;background:#fffaf2;border:1px solid var(--line);border-radius:11px}.stat b{display:block;font-size:24px;color:var(--wine)}label{display:block;font-size:13px;font-weight:700;margin:8px 0 4px}input,select,textarea{width:100%;padding:10px;border:1px solid #d8cfc7;border-radius:8px;font:inherit}textarea{min-height:70px}button{border:0;border-radius:8px;background:var(--wine);color:white;padding:10px 13px;font-weight:750;cursor:pointer;margin-top:8px}.msg{padding:10px;border-radius:9px;background:#fff3d5;margin-top:10px;white-space:pre-wrap}.item{border:1px solid var(--line);border-radius:12px;padding:13px;margin:10px 0}.muted{font-size:12px;color:var(--muted)}.hidden{display:none!important}.filters{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}.filters{grid-template-columns:1fr}main{padding:0 10px 35px}}
</style></head><body><header><h1>महिला शक्ति अभियान — Admin Panel</h1><div>केवल अधिकृत SBPF प्रशासकों के लिए</div></header><main>
<section class="card" id="login"><h2>Admin Login</h2><label>ईमेल</label><input id="email" type="email" autocomplete="username"><label>पासवर्ड</label><input id="password" type="password" autocomplete="current-password"><button id="loginBtn">लॉगिन करें</button><div id="loginMsg" class="msg hidden"></div></section>
<section id="dashboard" class="hidden"><div class="card"><h2>आवेदन डैशबोर्ड</h2><div id="stats" class="grid"></div></div><div class="card"><div class="filters"><div><label>स्थिति फ़िल्टर</label><select id="status"><option value="">सभी आवेदन</option><option value="submitted">नया आवेदन</option><option value="under_review">समीक्षा में</option><option value="need_information">अतिरिक्त जानकारी</option><option value="referred">रेफर किया गया</option><option value="registered">पंजीकृत</option><option value="in_progress">कार्यवाही में</option><option value="resolved">समाधान</option><option value="rejected">अस्वीकृत</option><option value="cancelled">रद्द</option></select></div><div><label>खोजें</label><input id="search" placeholder="नाम, Member ID या आवेदन संख्या"></div></div><div id="requests">लोड हो रहा है…</div></div></section>
</main><script>
const API='https://dxowhzghrdghfzoggorx.supabase.co',KEY='sb_publishable_Papyb2MMv6Sr3V3QMjVSNQ_3GWXCiCo',$=id=>document.getElementById(id);let token=localStorage.getItem('sbpf_access_token')||'',all=[];
async function api(path,opt={}){const h={apikey:KEY,...(token?{Authorization:'Bearer '+token}:{}),...(opt.headers||{})};const r=await fetch(API+path,{...opt,headers:h});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.message||d.msg||d.error_description||'अनुरोध विफल');return d}
async function rpc(n,a={}){return api('/rest/v1/rpc/'+n,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(a)})}
function esc(v){return String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function msg(t){$('loginMsg').textContent=t;$('loginMsg').classList.remove('hidden')}
async function start(){if(!token)throw Error('लॉगिन आवश्यक');const a=await rpc('is_admin');if(!(a===true||(Array.isArray(a)&&a[0]===true)))throw Error('इस खाते को Admin अनुमति नहीं है।');$('login').classList.add('hidden');$('dashboard').classList.remove('hidden');await load()}
$('loginBtn').onclick=async()=>{try{$('loginBtn').disabled=true;const d=await api('/auth/v1/token?grant_type=password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value.trim(),password:$('password').value})});token=d.access_token;localStorage.setItem('sbpf_access_token',token);if(d.refresh_token)localStorage.setItem('sbpf_refresh_token',d.refresh_token);await start()}catch(e){msg(e.message)}finally{$('loginBtn').disabled=false}};
async function load(){const [s,r]=await Promise.all([rpc('admin_women_empowerment_summary'),rpc('admin_list_women_empowerment_requests',{p_status:$('status').value||null,p_limit:300})]);$('stats').innerHTML=[['कुल आवेदन',s.total],['नए आवेदन',s.submitted],['समीक्षा में',s.under_review],['अति आवश्यक',s.urgent],['रेफर',s.referred],['समाधान',s.resolved]].map(x=>'<div class="stat"><b>'+Number(x[1]||0)+'</b>'+x[0]+'</div>').join('');all=Array.isArray(r)?r:[];render()}
function render(){const q=$('search').value.trim().toLocaleLowerCase('hi');const rows=all.filter(x=>[x.request_number,x.applicant_name,x.member_id,x.service_name,x.district].some(v=>String(v||'').toLocaleLowerCase('hi').includes(q)));$('requests').innerHTML=rows.length?rows.map(x=>'<article class="item"><b>'+esc(x.applicant_name)+' • '+esc(x.request_number)+'</b><div class="muted">Member ID: '+esc(x.member_id)+' • '+esc(x.service_name)+' • '+esc(x.district)+' • '+esc(x.created_at?new Date(x.created_at).toLocaleString('hi-IN'):'')+'</div><p>'+esc(x.short_need)+'</p><p class="muted">मोबाइल: '+esc(x.contact_phone)+' • प्राथमिकता: '+esc(x.urgency)+' • वर्तमान स्थिति: '+esc(x.status)+'</p><p>'+esc(x.details||'')+'</p><label>स्थिति अपडेट</label><select id="st-'+x.id+'">'+['under_review','need_information','referred','registered','in_progress','resolved','rejected','cancelled'].map(v=>'<option value="'+v+'" '+(x.status===v?'selected':'')+'>'+v+'</option>').join('')+'</select><label>Admin टिप्पणी</label><textarea id="note-'+x.id+'">'+esc(x.admin_note||'')+'</textarea><button data-save="'+x.id+'">अपडेट सहेजें</button></article>').join(''):'<p class="muted">कोई आवेदन नहीं मिला।</p>'}
$('requests').addEventListener('click',async e=>{const id=e.target?.dataset?.save;if(!id)return;try{e.target.disabled=true;await rpc('admin_review_women_empowerment_request',{p_request_id:Number(id),p_new_status:$('st-'+id).value,p_admin_note:$('note-'+id).value,p_referral_organization:null,p_referral_contact:null,p_outcome_note:null});await load()}catch(err){alert(err.message)}finally{e.target.disabled=false}});
$('status').onchange=()=>load().catch(e=>msg(e.message));$('search').oninput=render;
start().catch(e=>{if(token){msg(e.message);localStorage.removeItem('sbpf_access_token');token=''}});
</script></body></html>
