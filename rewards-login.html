<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#781626">
<title>SBPF Rewards सुरक्षित प्रवेश</title>
<style>
:root{--wine:#781626;--ink:#28232a;--muted:#756d70;--line:#e8dfd7}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f6f5f2;color:var(--ink);font:16px/1.6 system-ui,"Noto Sans Devanagari",sans-serif;display:grid;place-items:center;padding:18px}
main{width:min(100%,440px)}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:0 10px 30px #26170c0d}
h1{text-align:center;color:var(--wine);font-size:24px;margin:0 0 4px}.sub{text-align:center;color:var(--muted);font-size:13px;margin:0 0 20px}
label{display:block;font-size:13px;font-weight:700;margin:13px 0 5px}
input{width:100%;padding:13px;border:1px solid #ddd6d0;border-radius:10px;font:inherit}
button,.link{display:flex;align-items:center;justify-content:center;width:100%;padding:13px;border:0;border-radius:10px;background:var(--wine);color:#fff;text-decoration:none;font-weight:800;margin-top:14px;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}.note{background:#fffaf0;border:1px solid #eee2c8;border-radius:10px;padding:11px;margin-top:14px;font-size:13px;color:#51483e}
.msg{font-size:13px;margin-top:12px;color:#a01828}.ok{color:#176b42}.hidden{display:none!important}
footer{text-align:center;color:var(--muted);font-size:11px;margin:14px 8px}
</style></head>
<body><main><section class="card">
<h1>Rewards Zone प्रवेश</h1><p class="sub">सत्यापित सदस्य के लिए सुरक्षित OTP</p>
<div id="emailStep">
<label for="email">पंजीकृत ईमेल</label>
<input id="email" type="email" autocomplete="email" placeholder="पंजीकृत ईमेल दर्ज करें" required>
<button id="sendBtn" type="button">ईमेल पर OTP भेजें</button>
</div>
<div id="otpStep" class="hidden">
<label for="otp">ईमेल पर प्राप्त 6 अंकों का OTP</label>
<input id="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" placeholder="6 अंकों का OTP">
<button id="verifyBtn" type="button">OTP सत्यापित करके प्रवेश करें</button>
<button id="resendBtn" type="button" style="background:#fff;color:var(--wine);border:1px solid var(--line)">OTP दोबारा भेजें</button>
</div>
<div id="message" class="msg" role="status" aria-live="polite"></div>
<div class="note">सार्वजनिक Member ID सत्यापन से निजी वॉलेट नहीं खुलता। OTP उसी ईमेल पर भेजा जाएगा जो पहले से SBPF Auth खाते में पंजीकृत है। नया खाता यहाँ नहीं बनाया जाएगा।</div>
<a class="link" href="member-verification.html" style="background:#fff;color:var(--wine);border:1px solid var(--line)">सार्वजनिक सदस्य सत्यापन</a>
</section><footer>स्वर्णिम भारत परिवार फाउंडेशन • सुरक्षित सदस्य प्रवेश</footer></main>
<script>
const API="https://dxowhzghrdghfzoggorx.supabase.co";
const KEY="sb_publishable_Papyb2MMv6Sr3V3Q3MjVSNQ_3GWXCiCo";
const $=id=>document.getElementById(id);
let email="";
async function auth(path,body){
 const r=await fetch(API+"/auth/v1/"+path,{method:"POST",headers:{apikey:KEY,"Content-Type":"application/json"},body:JSON.stringify(body)});
 let d={};try{d=await r.json()}catch{}
 if(!r.ok)throw new Error(d.msg||d.message||d.error_description||d.error||"सुरक्षित प्रवेश पूरा नहीं हो सका।");
 return d;
}
async function sendOtp(){
 email=$("email").value.trim().toLowerCase();
 if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))throw new Error("कृपया सही पंजीकृत ईमेल दर्ज करें।");
 await auth("otp",{email,create_user:false});
 $("emailStep").classList.add("hidden");$("otpStep").classList.remove("hidden");
 $("message").className="msg ok";$("message").textContent="यदि यह ईमेल पंजीकृत है, तो OTP भेजा गया है। अपना Inbox और Spam फ़ोल्डर जाँचें।";
}
$("sendBtn").addEventListener("click",async()=>{const b=$("sendBtn");b.disabled=true;try{await sendOtp()}catch(e){$("message").textContent=e.message}finally{b.disabled=false}});
$("resendBtn").addEventListener("click",async()=>{const b=$("resendBtn");b.disabled=true;try{await auth("otp",{email,create_user:false});$("message").textContent="नया OTP भेजने का अनुरोध पूरा हुआ।"}catch(e){$("message").textContent=e.message}finally{b.disabled=false}});
$("verifyBtn").addEventListener("click",async()=>{
 const b=$("verifyBtn");b.disabled=true;
 try{
  const code=$("otp").value.trim();if(!/^\d{6}$/.test(code))throw new Error("6 अंकों का OTP दर्ज करें।");
  const d=await auth("verify",{email,token:code,type:"email"});
  if(!d.access_token||!d.user?.id)throw new Error("Auth Session नहीं मिला।");
  localStorage.setItem("sbpf_access_token",d.access_token);
  if(d.refresh_token)localStorage.setItem("sbpf_refresh_token",d.refresh_token);
  location.replace("rewards.html");
 }catch(e){$("message").textContent=e.message}finally{b.disabled=false}
});
</script></body></html>
