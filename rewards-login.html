<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#781626">
<title>SBPF Rewards सुरक्षित प्रवेश</title>
<style>
:root{--wine:#781626;--ink:#28232a;--muted:#756d70;--line:#e8dfd7}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f6f5f2;color:var(--ink);font:16px/1.6 system-ui,"Noto Sans Devanagari",sans-serif;display:grid;place-items:center;padding:18px}
main{width:min(100%,440px)}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:0 10px 30px #26170c0d}
h1{text-align:center;color:var(--wine);font-size:24px;margin:0 0 4px}.sub{text-align:center;color:var(--muted);font-size:13px;margin:0 0 20px}
label{display:block;font-size:13px;font-weight:700;margin:13px 0 5px}
input{width:100%;padding:13px;border:1px solid #ddd6d0;border-radius:10px;font:inherit}
button,.link{display:flex;align-items:center;justify-content:center;width:100%;padding:13px;border:0;border-radius:10px;background:var(--wine);color:#fff;text-decoration:none;font-weight:800;margin-top:14px;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}.msg{font-size:13px;margin-top:12px;color:#a01828}.ok{color:#176b42}
footer{text-align:center;color:var(--muted);font-size:11px;margin:14px 8px}
</style></head>
<body><main><section class="card">
<h1>Rewards Zone प्रवेश</h1><p class="sub">सत्यापित SBPF सदस्य</p>
<form id="loginForm" autocomplete="on">
<label for="memberId">SBPF Member ID</label>
<input id="memberId" maxlength="40" autocomplete="username" autocapitalize="characters" placeholder="अपनी SBPF Member ID दर्ज करें" required>
<label for="password">पासवर्ड</label>
<input id="password" type="password" autocomplete="current-password" placeholder="अपना पासवर्ड दर्ज करें" required>
<button id="loginBtn" type="submit">सुरक्षित प्रवेश करें</button>
</form>
<div id="message" class="msg" role="status" aria-live="polite"></div>
<a class="link" href="member-verification.html" style="background:#fff;color:var(--wine);border:1px solid var(--line)">सार्वजनिक सदस्य सत्यापन</a>
</section><footer>स्वर्णिम भारत परिवार फाउंडेशन • सुरक्षित सदस्य प्रवेश</footer></main>
<script>
const API="https://dxowhzghrdghfzoggorx.supabase.co";
const KEY="sb_publishable_Papyb2MMv6Sr3V3QMjVSNQ_3GWXCiCo";
const $=id=>document.getElementById(id);
$("loginForm").addEventListener("submit",async event=>{
 event.preventDefault();
 const button=$("loginBtn");button.disabled=true;button.textContent="सत्यापन हो रहा है…";
 $("message").textContent="";$("message").className="msg";
 try{
  const member_id=$("memberId").value.trim().toUpperCase();
  const password=$("password").value;
  if(!/^[A-Z0-9-]{6,40}$/.test(member_id))throw new Error("कृपया सही SBPF Member ID दर्ज करें।");
  if(!password||password.length>256)throw new Error("कृपया अपना पासवर्ड दर्ज करें।");
  const response=await fetch(API+"/functions/v1/member-id-login",{
   method:"POST",headers:{apikey:KEY,"Content-Type":"application/json"},
   body:JSON.stringify({member_id,password})
  });
  let data={};try{data=await response.json()}catch{}
  if(!response.ok||!data.access_token||!data.user?.id)throw new Error(data.error||"Member ID या पासवर्ड सही नहीं है।");
  localStorage.setItem("sbpf_access_token",data.access_token);
  if(data.refresh_token)localStorage.setItem("sbpf_refresh_token",data.refresh_token);
  $("password").value="";
  location.replace("rewards.html");
 }catch(error){
  $("message").textContent=error.message||"सुरक्षित प्रवेश पूरा नहीं हो सका।";
 }finally{button.disabled=false;button.textContent="सुरक्षित प्रवेश करें";}
});
</script></body></html>
