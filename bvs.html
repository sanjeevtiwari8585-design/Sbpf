<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BVS | Swarnim Vyapar</title><style>body{font-family:Arial;margin:0;background:#f5f5f5;color:#222}.wrap{max-width:900px;margin:auto;padding:24px}.card{background:#fff;padding:22px;border-radius:12px;margin:16px 0;box-shadow:0 2px 10px #ddd}input,textarea,select,button{width:100%;padding:12px;margin:7px 0;box-sizing:border-box;border:1px solid #ccc;border-radius:8px}button{background:#8a6a16;color:#fff;border:0;font-weight:bold;cursor:pointer}.note{font-size:14px;color:#666}</style></head><body><main class="wrap"><h1>स्वर्णिम व्यापार सेवा (BVS)</h1><p>SBPF Member आधारित Business एवं Property Management Portal</p><p><a href='member.html'>पहले SBPF Member Login करें</a> | <a href='index.html'>मुख्य वेबसाइट</a></p><section class="card"><h2>Business Profile</h2><form id="businessForm"><input id="name" placeholder="Business Name" required><input id="type" placeholder="Business Type"><input id="phone" placeholder="Mobile Number"><input id="city" placeholder="City"><textarea id="desc" placeholder="Business Description"></textarea><button>Business Profile Submit करें</button></form><p class="note">Login verification और admin approval के बाद profile सक्रिय होगी।</p></section><section class="card"><h2>Property / Real Estate Listing</h2><form id="propertyForm"><input id="title" placeholder="Property Title" required><select id="ptype"><option value="plot">Plot</option><option value="house">House</option><option value="shop">Shop</option><option value="commercial">Commercial</option></select><input id="price" type="number" placeholder="Price"><input id="location" placeholder="Location"><textarea id="pdesc" placeholder="Property Details"></textarea><button>Listing Submit करें</button></form></section><div id="msg"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const URL='https://dxowhzghrdghfzoggorx.supabase.co',KEY='sb_publishable_Papyb2MMv6Sr3V3QMjVSNQ_3GWXCiCo';const msg=t=>document.getElementById('msg').textContent=t;let sb=null;document.getElementById('businessForm').onsubmit=async e=>{e.preventDefault();if(!KEY)return msg('Supabase publishable key को existing website configuration से सुरक्षित रूप से जोड़ना बाकी है।');const {data:{user}}=await sb.auth.getUser();if(!user)return msg('कृपया पहले SBPF Member Login करें।');const r=await sb.from('bvs_business_profiles').insert({member_id:user.id,business_name:name.value,business_type:type.value,phone:phone.value,city:city.value,description:desc.value});msg(r.error?r.error.message:'Business profile सफलतापूर्वक submit हुआ।')};document.getElementById('propertyForm').onsubmit=e=>{e.preventDefault();msg('Property listing के लिए पहले approved business profile आवश्यक है।')};if(KEY)sb=supabase.createClient(URL,KEY);</script></body></html>
