<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SBPF Admin | स्वर्णिम सेवा</title>
<style>
:root{--navy:#12345b;--green:#13805b;--gold:#d4a72c;--paper:#f5f7fa;--ink:#1c2430;--muted:#5e6878;--line:#dce3eb;--danger:#a21f2d}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,Arial,sans-serif;line-height:1.5}header{background:linear-gradient(120deg,#12345b,#176d68);color:white;padding:18px max(16px,calc((100% - 1120px)/2));border-bottom:4px solid var(--gold)}header h1{margin:0}header p{margin:4px 0;color:#e3f2ee}.wrap{max-width:1120px;margin:auto;padding:18px}.box,.case{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.filters{display:flex;gap:10px;flex-wrap:wrap}.filters>*{flex:1;min-width:160px}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px}label{display:block;font-size:13px;font-weight:700;margin:9px 0 4px}button{background:var(--navy);color:white;border:0;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer}.light{background:#fff;color:var(--navy);border:1px solid var(--line)}.green{background:var(--green)}.notice{background:#fff5d8;border-radius:9px;padding:10px;margin:10px 0}.error{background:#fff0f0;color:#842029}.ok{background:#eaf8ef;color:#175c2b}.muted,small{color:var(--muted)}.case h3{margin:5px 0;color:var(--navy)}.caseHead{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.actions button{font-size:12px}.hidden{display:none!important}@media(max-width:650px){.grid{grid-template-columns:1fr}.wrap{padding:10px}}
</style></head><body><header><h1>स्वर्णिम सेवा — प्रशासनिक नियंत्रण</h1><p>आवेदन समीक्षा • सत्यापन • अधिकारी नियुक्ति • समाधान रिकॉर्ड</p></header><main class="wrap">
<section id="login" class="box" style="max-width:460px;margin:7vh auto"><h2>अधिकृत एडमिन लॉगिन</h2><label>ईमेल</label><input id="email" type="email" autocomplete="username"><label>पासवर्ड</label><input id="password" type="password" autocomplete="current-password"><button id="loginBtn" style="width:100%;margin-top:12px">प्रवेश करें</button><div id="loginMsg" class="notice hidden"></div></section>
<section id="dashboard" class="hidden"><div class="box"><div class="caseHead"><div><h2>सहायता आवेदन</h2><p class="muted">यह सूची Supabase की Admin-only RLS अनुमति से आती है।</p></div><button id="refresh" class="light">रीफ्रेश</button></div><div class="filters"><select id="statusFilter"><option value="">सभी स्थितियाँ</option><option value="submitted">जमा</option><option value="under_review">समीक्षा</option><option value="need_more_info">अतिरिक्त जानकारी</option><option value="verified">सत्यापित</option><option value="assigned">नियुक्त</option><option value="in_progress">कार्य जारी</option><option value="referred">रेफर</option><option value="partially_supported">आंशिक सहायता</option><option value="resolved">समाधान</option><option value="closed">बंद</option><option value="rejected">अस्वीकृत</option></select><input id="search" placeholder="केस नंबर, नाम/विषय, जिला खोजें"></div><div id="summary" class="notice">लोड हो रहा है…</div></div><div id="cases"></div></section></main>
<script>
const API='https://dxowhzghrdghfzoggorx.supabase.co',KEY='sb_publishable_Papyb2MMv6Sr3V3QMjVSNQ_3GWXCiCo';let token=localStorage.getItem('sbpf_access_token')||'',all=[];
const $=id=>document.getElementById(id),esc=v=>String(v??'—').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function api(path,opts={}){const h={apikey:KEY,...(token?{Authorization:'Bearer '+token}:{}),...(opts.headers||{})};const r=await fetch(API+path,{...opts,headers:h});let j;try{j=await r.json()}catch{}if(!r.ok)throw Error(j?.message||j?.details||j?.hint||'अनुरोध पूरा नहीं हुआ');return j}
async function login(){const b=$('loginBtn');b.disabled=true;try{const r=await api('/auth/v1/token?grant_type=password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value.trim(),password:$('password').value})});if(!r.access_token)throw Error('लॉगिन टोकन नहीं मिला');token=r.access_token;localStorage.setItem('sbpf_access_token',token);if(r.refresh_token)localStorage.setItem('sbpf_refresh_token',r.refresh_token);await load()}catch(e){$('loginMsg').className='notice error';$('loginMsg').textContent='प्रवेश नहीं हुआ: '+e.message;$('loginMsg').classList.remove('hidden')}finally{b.disabled=false}}
async function load(){try{const rows=await api('/rest/v1/swarnim_family_service_cases?select=*,seva_categories(name)&order=created_at.desc&limit=500');all=Array.isArray(rows)?rows:[];$('login').classList.add('hidden');$('dashboard').classList.remove('hidden');render()}catch(e){$('loginMsg').className='notice error';$('loginMsg').textContent='डेटा नहीं खुला। सुनिश्चित करें कि यह खाता SBPF Admin है। '+e.message;$('loginMsg').classList.remove('hidden')}}
const statuses=[['submitted','आवेदन जमा'],['under_review','समीक्षा में'],['need_more_info','अतिरिक्त जानकारी चाहिए'],['verified','सत्यापित'],['assigned','अधिकारी नियुक्त'],['in_progress','कार्य जारी'],['referred','संबंधित संस्था को भेजा'],['partially_supported','आंशिक सहायता'],['resolved','समाधान हुआ'],['closed','बंद'],['rejected','अस्वीकृत']];
function render(){const s=$('statusFilter').value,q=$('search').value.trim().toLowerCase();const rows=all.filter(x=>(!s||x.status===s)&&(!q||[x.case_number,x.title,x.description,x.district,x.village_or_ward].some(v=>String(v||'').toLowerCase().includes(q))));$('summary').textContent='कुल '+all.length+' आवेदन • फ़िल्टर में '+rows.length+' • लंबित समीक्षा '+all.filter(x=>['submitted','under_review','need_more_info'].includes(x.status)).length;
$('cases').innerHTML=rows.length?rows.map(x=>'<article class="case"><div class="caseHead"><b>'+esc(x.case_number)+'</b><b>'+esc(statuses.find(a=>a[0]===x.status)?.[1]||x.status)+'</b></div><h3>'+esc(x.title)+'</h3><small>'+esc(x.seva_categories?.name||'सेवा')+' • '+esc(x.urgency)+' • '+esc(x.district)+' / '+esc(x.village_or_ward)+'</small><p style="white-space:pre-wrap">'+esc(x.description)+'</p><div class="grid"><div><small>परिवार ID: '+esc(x.family_id)+' • सदस्य ID: '+esc(x.family_member_id||'पूरा परिवार')+'</small><br><small>संपर्क: '+esc(x.contact_phone)+'</small></div><div><small>अनुरोध: '+esc(x.requested_support)+'</small><br><small>जमा: '+esc(x.submitted_at?new Date(x.submitted_at).toLocaleString('hi-IN'):'')+'</small></div></div><label>आवेदन की स्थिति</label><select id="status-'+x.id+'">'+statuses.map(a=>'<option value="'+a[0]+'" '+(a[0]===x.status?'selected':'')+'>'+a[1]+'</option>').join('')+'</select><label>कार्रवाई / समाधान नोट</label><textarea id="note-'+x.id+'" maxlength="2000" placeholder="परिवार को दिखाई देने वाला अपडेट या समाधान लिखें">'+esc(x.resolution_summary||'')+'</textarea><label>स्वीकृत सहायता राशि (वैकल्पिक)</label><input id="amount-'+x.id+'" type="number" min="0" step="0.01" value="'+esc(x.approved_amount??'')+'"><div class="actions"><button class="green" onclick="saveCase('+x.id+')">स्थिति सुरक्षित करें</button></div><div id="msg-'+x.id+'"></div></article>').join(''):'<div class="box muted">इस फ़िल्टर में कोई आवेदन नहीं मिला।</div>'}
async function saveCase(id){const x=all.find(a=>a.id===id);if(!x)return;const status=$('status-'+id).value,note=$('note-'+id).value.trim(),amount=$('amount-'+id).value;const msg=$('msg-'+id);try{const patch={status,updated_at:new Date().toISOString()};if(note)patch.resolution_summary=note;if(amount!=='')patch.approved_amount=Number(amount);if(status==='resolved')patch.resolved_at=new Date().toISOString();await api('/rest/v1/swarnim_family_service_cases?id=eq.'+id,{method:'PATCH',headers:{'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify(patch)});await api('/rest/v1/swarnim_family_service_case_updates',{method:'POST',headers:{'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({case_id:id,old_status:x.status,new_status:status,update_note:note||('स्थिति बदली गई: '+status),visibility:'family',created_by:(await api('/auth/v1/user')).id})});msg.className='notice ok';msg.textContent='अपडेट सुरक्षित हो गया।';await load()}catch(e){msg.className='notice error';msg.textContent='अपडेट नहीं हुआ: '+e.message}}
$('loginBtn').addEventListener('click',login);$('refresh').addEventListener('click',load);$('statusFilter').addEventListener('change',render);$('search').addEventListener('input',render);
if(token)load().catch(e=>{token='';localStorage.removeItem('sbpf_access_token')});
</script></body></html>
