<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#17613f">
<title>SBPF सदस्य सत्यापन</title>
<link rel="stylesheet" href="assets/sbpf-grid-layout.css">
<style>
:root{--wine:#781626;--ink:#28232a;--muted:#756d70;--line:#e8dfd7}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f6f5f2;color:var(--ink);font:16px/1.6 system-ui,"Noto Sans Devanagari",sans-serif;display:grid;place-items:center;padding:18px}
main{width:min(100%,440px)}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 10px 30px #26170c0d}
.logo{width:82px;height:82px;object-fit:contain;display:block;margin:0 auto 8px}
h1{text-align:center;color:var(--wine);font-size:23px;margin:0 0 2px}.sub{text-align:center;color:var(--muted);font-size:13px;margin:0 0 18px}
label{display:block;font-size:13px;font-weight:700;margin:12px 0 5px}
input{width:100%;padding:13px;border:1px solid #ddd6d0;border-radius:10px;font:inherit;text-transform:uppercase}
button,.link{display:flex;align-items:center;justify-content:center;width:100%;padding:13px;border:0;border-radius:10px;background:var(--wine);color:#fff;text-decoration:none;font-weight:800;margin-top:14px;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}.note{background:#fffaf0;border:1px solid #eee2c8;border-radius:10px;padding:11px;margin-top:12px;font-size:13px;color:#51483e}
.result{margin-top:14px;border:1px solid var(--line);border-radius:12px;padding:14px;background:#fff}.result.ok{border-color:#b8ddc6;background:#f1faf4}.result.pending{border-color:#ead9a7;background:#fffaf0}
.status{font-weight:800;color:var(--wine);font-size:17px}.checks{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.check{padding:9px;border-radius:9px;background:#fff;border:1px solid var(--line);font-size:12px}.yes{color:#176b42;font-weight:800}.no{color:#a01828;font-weight:800}
.msg{font-size:13px;margin-top:10px;color:#a01828}.hidden{display:none!important}footer{text-align:center;color:var(--muted);font-size:11px;margin:14px 8px}
@media(max-width:380px){body{padding:10px}.card{padding:17px}.checks{grid-template-columns:1fr}}
</style></head>
<body><main><section class="card">
<img id="logo" class="logo" alt="SBPF">
<h1>सदस्य सत्यापन</h1><p class="sub">स्वर्णिम भारत परिवार फाउंडेशन</p>
<form id="verifyForm">
<label for="memberId">SBPF Member ID</label>
<input id="memberId" maxlength="40" autocomplete="off" autocapitalize="characters" placeholder="अपनी SBPF Member ID डालें" required>
<button id="verifyBtn" type="submit">सदस्य सत्यापित करें</button>
</form>
<div id="message" class="msg" role="status" aria-live="polite"></div>
<div id="result" class="result hidden" aria-live="polite"></div>
<div class="note">यह केवल सार्वजनिक सदस्यता सत्यापन है। इससे किसी निजी सदस्य खाते या व्यक्तिगत पैनल में प्रवेश नहीं मिलता। निजी जानकारी सुरक्षित रखी जाती है।</div>
<a class="link" href="member-services.html" style="background:#fff;color:var(--wine);border:1px solid var(--line)">निजी सदस्य सेवाएँ</a>\n<a class="link" href="rewards-login.html" style="background:var(--wine);color:#fff">Rewards Zone में सुरक्षित प्रवेश</a>
</section><footer>स्वर्णिम भारत परिवार फाउंडेशन • सुरक्षित सदस्य सत्यापन</footer></main>
<script>
const API="https://dxowhzghrdghfzoggorx.supabase.co";
const KEY="sb_publishable_Papyb2MMv6Sr3V3QMjVSNQ_3GWXCiCo";
const logoPath="/public/assets/%E0%A4%B8%E0%A5%8D%E0%A4%B5%E0%A4%B0%E0%A5%8D%E0%A4%A3%E0%A4%BF%E0%A4%AE%20%E0%A4%AD%E0%A4%BE%E0%A4%B0%E0%A4%A4%20%E0%A4%AA%E0%A4%B0%E0%A4%BF%E0%A4%B5%E0%A4%BE%E0%A4%B0%20%E0%A4%AB%E0%A4%BE%E0%A4%89%E0%A4%82%E0%A4%A1%E0%A5%87%E0%A4%B6%E0%A4%A8%20%E0%A4%AA%E0%A5%8D%E0%A4%B0%E0%A4%A4%E0%A5%80%E0%A4%95.png";
document.getElementById("logo").src=logoPath;
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
$("verifyForm").addEventListener("submit",async e=>{
 e.preventDefault();const btn=$("verifyBtn");btn.disabled=true;btn.textContent="सत्यापन हो रहा है…";$("message").textContent="";$("result").className="result hidden";$("result").innerHTML="";
 try{
  const member_id=$("memberId").value.trim().toUpperCase();
  if(!/^[A-Z0-9-]{6,40}$/.test(member_id))throw new Error("कृपया सही SBPF Member ID दर्ज करें।");
  const response=await fetch(API+"/functions/v1/member-id-verify",{method:"POST",headers:{apikey:KEY,"Content-Type":"application/json"},body:JSON.stringify({member_id})});
  let data={};try{data=await response.json()}catch{}
  if(!response.ok)throw new Error(data.error||"सत्यापन पूरा नहीं हो सका।");
  const checks=[["Member ID",data.checks.member_id_valid],["भुगतान",data.checks.payment_verified],["KYC",data.checks.kyc_verified],["सदस्यता",data.checks.membership_active],["वार्षिक सत्यापन",data.checks.annual_verification_valid]];
  $("result").className="result "+(data.fully_verified?"ok":"pending");
  $("result").innerHTML='<div class="status">'+(data.fully_verified?"✓ पूर्ण सत्यापित":"सत्यापन लंबित")+'</div><div style="font-size:13px;margin-top:4px">Member ID: <b>'+esc(data.member_id||member_id)+'</b></div><div class="checks">'+checks.map(([name,ok])=>'<div class="check">'+esc(name)+'<br><span class="'+(ok?"yes":"no")+'">'+(ok?"✓ सत्यापित":"○ लंबित")+'</span></div>').join("")+'</div><div style="font-size:11px;color:#756d70;margin-top:10px">जाँच समय: '+new Date(data.checked_at).toLocaleString("hi-IN")+'</div>';
 }catch(err){$("message").textContent=err.message||"सत्यापन सेवा उपलब्ध नहीं है।"}
 finally{btn.disabled=false;btn.textContent="सदस्य सत्यापित करें"}
});
</script></body></html>
